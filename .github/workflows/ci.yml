name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate TLGD package
        run: python3 tlgd/scripts/check.py
      - name: Test benchmark harness
        run: python3 -m unittest discover -s benchmarks/tests -p 'test_*.py'
      - name: Check benchmark manifest without agents
        run: python3 benchmarks/run.py doctor
